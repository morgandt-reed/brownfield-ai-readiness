[project]
name = "orders-api"
version = "2.4.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.9.2",
    "sqlalchemy==2.0.35",
    "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0"]

[tool.pytest.ini_options]
addopts = "--cov=orders --cov-fail-under=80"
